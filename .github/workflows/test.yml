name: offline-tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ["3.9", "3.12"]
        exclude:
          - os: ubuntu-latest   # 新版 Ubuntu 运行环境已不提供 3.9；学员只用 Mac/Windows
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline tests (mock API, no account needed)
        run: python -m unittest discover -s tests -v
